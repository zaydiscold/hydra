name: Electron package smoke

# Only runs when packaging-relevant files change (not every PR), and only does a
# single Linux package smoke. lint/test:ci/gate already run on every PR in ci.yml
# (re-running them here on 3 OSes was the biggest CI cost). Full mac/Windows/Linux
# packaging happens at release time in release.yml.
on:
  pull_request:
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'scripts/electron-build.mjs'
      - 'scripts/prepare-electron-resources.mjs'
      - 'scripts/smoke-electron-package.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'prisma/schema.prisma'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: "file:./prisma/ci.db"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HYDRA_DATA_DIR: ".hydra-ci-data"
  JWT_SECRET: "ci-test-secret-32-characters-long"

jobs:
  package-smoke:
    name: linux package smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run electron:prepare
        env:
          HYDRA_BUILD_TARGET: linux-x64
      - run: npx electron-builder --linux AppImage --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HYDRA_SKIP_NOTARIZE: '1'
      - run: npm run electron:smoke
        env:
          HYDRA_BUILD_TARGET: linux-x64
