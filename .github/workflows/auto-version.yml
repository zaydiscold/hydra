name: Auto-version

# An ordinary push to master is NOT a release trigger. A release is created only
# when the triggering commit explicitly contains one of:
#   [bump:patch]  [bump:minor]  [bump:major]
#
# The release job then:
#   1. Reads package.json version
#   2. Tags that version if it has not been tagged yet, or applies the requested bump
#   3. Writes package.json + package-lock.json when a bump is needed
#   4. Commits with [skip-bump] so the workflow cannot recurse
#   5. Pushes the matching vX.Y.Z tag
#   6. Dispatches release.yml on that immutable tag
#
# [skip-bump] remains the explicit escape hatch for source, docs, test, and
# repository-maintenance commits that should never ship a desktop update.

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-version-master
  cancel-in-progress: false

jobs:
  bump-and-tag:
    runs-on: ubuntu-22.04
    # Requiring an explicit marker prevents docs, cleanup, merge, and bot commits
    # from silently becoming public desktop releases.
    if: |
      !contains(github.event.head_commit.message, '[skip-bump]') &&
      !contains(github.event.head_commit.message, 'chore(release):') &&
      (
        contains(github.event.head_commit.message, '[bump:patch]') ||
        contains(github.event.head_commit.message, '[bump:minor]') ||
        contains(github.event.head_commit.message, '[bump:major]')
      )
    steps:
      - name: Checkout master with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Determine next version
        id: nextver
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          echo "current=$current"

          # If package.json was advanced but never tagged, publish that exact
          # version rather than incrementing it a second time.
          if ! git rev-parse "v$current" >/dev/null 2>&1 \
             && ! git ls-remote --tags origin "v$current" | grep -q "v$current"; then
            echo "next=$current" >> "$GITHUB_OUTPUT"
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
            echo "Catching up: package.json is at $current but no tag exists. Tagging current."
            exit 0
          fi

          if [[ "$COMMIT_MESSAGE" == *"[bump:major]"* ]]; then
            bump="major"
          elif [[ "$COMMIT_MESSAGE" == *"[bump:minor]"* ]]; then
            bump="minor"
          elif [[ "$COMMIT_MESSAGE" == *"[bump:patch]"* ]]; then
            bump="patch"
          else
            echo "Explicit [bump:patch], [bump:minor], or [bump:major] marker required." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          next="${major}.${minor}.${patch}"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $next ($bump)"

      - name: Write new version into package.json
        if: steps.nextver.outputs.needs_bump == 'true'
        run: |
          npm version "${{ steps.nextver.outputs.next }}" \
            --no-git-tag-version \
            --allow-same-version
          git config user.name 'hydra-bot'
          git config user.email 'hydra-bot@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): v${{ steps.nextver.outputs.next }} [skip-bump]"
          git push origin master

      - name: Tag and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW="v${{ steps.nextver.outputs.next }}"
          git config user.name 'hydra-bot'
          git config user.email 'hydra-bot@users.noreply.github.com'
          git tag -a "$NEW" -m "Release $NEW"
          git push origin "$NEW"
          gh workflow run release.yml --ref "$NEW"
          echo "Pushed tag $NEW and dispatched release.yml on $NEW."
